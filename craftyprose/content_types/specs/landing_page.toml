id = "landing_page"
name = "Landing page"
goal = "convert"
description = "A page with one conversion goal: it states the value plainly, proves it with approved claims and answers objections."

[length]
unit = "words"
range = [300, 900]

[anatomy]
required = ["headline", "subhead", "value_points", "proof", "primary_cta"]
optional = ["objections", "faq"]
headings = true

[anatomy.counts]
value_points = [2, 6]
faq = [3, 6]

[evidence]
third_party_required = false
min_supported_claims = 2

[evidence.max_source_age_years]
statistic = 3
default = 5

[discoverability]
enabled = true
primary_question_required = false
title_chars = [30, 65]
meta_description_chars = [120, 160]
keyword_density_max = 0.03
internal_links = [0, 3]
jsonld = ["WebPage", "FAQPage"]

[human_writing]
mode = "marketing"

[review]
judges = ["evidence", "editorial", "writing"]

[release]
format = "markdown"
citation_style = "none"

[approval]
required = true

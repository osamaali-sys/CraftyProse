[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craftyprose"
version = "0.1.0"
description = "A gated content engine for business and marketing content"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The production LLM adapter (milestone M8). Tests never need it.
anthropic = ["anthropic"]

[project.scripts]
craftyprose = "craftyprose.cli:main"

[tool.setuptools.packages.find]
include = ["craftyprose*"]

[tool.setuptools.package-data]
craftyprose = ["runtime/pricing.toml"]
